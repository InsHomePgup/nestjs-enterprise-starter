name: CI

# Manual only: run from GitHub UI (Actions -> CI -> Run workflow) or `gh workflow run CI`.
# To run automatically, add `push: { branches: [main] }` / `pull_request:` here.
# Optional extra pipelines are described in docs/ci-options.md.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  # Must match .env.test so the app (ConfigModule) and Prisma CLI hit the same database.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_db_test

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed for the breaking-change check

      # pnpm version comes from the `packageManager` field in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & format check
        run: pnpm exec biome ci .

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm db:deploy

      # Fails if prisma/schema was changed without generating a migration (`pnpm db:migrate`).
      - name: Check migrations are in sync with schema
        run: pnpm prisma migrate diff --from-config-datasource --to-schema prisma/schema --exit-code

      - name: Unit tests
        run: pnpm test

      - name: E2E tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

      # openapi.json is the contract shared with frontends; it must match the code.
      - name: OpenAPI contract is up to date
        run: |
          node dist/src/cli/export-openapi.js
          if ! git diff --exit-code openapi.json; then
            echo "::error::openapi.json is stale. Run 'pnpm openapi:export' and commit the result."
            exit 1
          fi

      # Report-only: lists breaking API changes since the latest release tag so you know what
      # changed for clients. Never fails the build (this project accepts breaking changes).
      - name: Report breaking API changes (informational)
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "$LAST_TAG" ] || ! git cat-file -e "$LAST_TAG:openapi.json" 2>/dev/null; then
            echo "No openapi.json in the latest release ($LAST_TAG); skipping."
            exit 0
          fi
          mkdir -p /tmp/oas && git show "$LAST_TAG:openapi.json" > /tmp/oas/base.json
          if ! docker run --rm -v /tmp/oas:/base:ro -v "$PWD":/specs:ro tufin/oasdiff:v1.34.1 \
               breaking /base/base.json /specs/openapi.json --fail-on ERR --flatten-allof; then
            echo "::warning::Breaking API changes since $LAST_TAG (see the list above). Not blocking."
          fi
